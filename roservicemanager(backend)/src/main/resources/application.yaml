spring:
  application:
    name: roservicemanager

  datasource:
    url: jdbc:postgresql://localhost:5432/ro_service_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

jwt:
  secret: odguQOy24rlTUQZrTVC/wFYG9YosV7GSppt1bEG6j6M=
  expiration: 28800000

# Dev-only shared secret for POST-ing new tenants/users via
# /api/platform-admin/**. Override with a real value via the
# PLATFORM_ADMIN_KEY env var - never rely on this default outside your own
# machine.
platform-admin:
  api-key: ${PLATFORM_ADMIN_KEY:dev-only-change-me}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE